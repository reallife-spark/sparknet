# sparknet — node services and tooling.
#
# This project is intentionally NOT packaged or installed. It is run directly
# from the vault (`make test`, `make validate`, the scripts/ wrappers), so there
# is no build-system section and nothing to `pip install`.
#
# `dependencies` is deliberately minimal: the only third-party package is
# `cryptography`, needed because Ed25519 verification is not in the Python
# standard library. Everything else is stdlib. tests/test_services.py asserts
# that this list is not quietly extended.

[project]
name = "sparknet"
version = "0.1.0"
description = "Self-contained DGX Spark node setup and development environment"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
# Opt-in via `make devtools`. The suite runs on a system pytest without this.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Opt-in via `make chroma-dev`. The fabric's runtime allow-list stays
# `cryptography` only — chromadb backs the OPTIONAL local index in
# scripts/sparknet-chroma.py and must never leak into `dependencies`.
chroma = [
    "chromadb>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# The suite must never touch the real blockchain/ledger.json; tests that need a
# ledger copy it into tmp_path themselves.
norecursedirs = [".venv", ".state", ".cache", "references", "node_modules"]
# The tier vocabulary, registered so `--strict-markers` accepts it and
# `pytest -m <marker>` can select a tier once tests carry the marks. Registering
# without applying is safe: `-m` merely deselects unmarked tests.
markers = [
    "unit: fast, isolated tests with no subprocesses or sockets",
    "integration: tests that spawn processes, bind ports or write the filesystem",
    "contract: cross-role contract conformance (see `make contract-test`)",
    "layout: repository structure, claims and hygiene invariants",
    "slow: tests that take noticeably long (measurable on a Spark node)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# The services are standalone scripts run directly from the vault.
# `.opencode/skills` is the vendored wiki suite (MIT, pinned upstream): it is
# not ours to reformat, and `make wiki-verify` proves it has not drifted, so
# ruff must keep its hands off it.
exclude = [".venv", ".state", ".cache", "references", ".opencode"]
# `ruff format` is a Python-only gate. Without this it also rewrites fenced
# code blocks inside Markdown, which produces documentation churn unrelated to
# any code change.
extend-exclude = ["*.md"]
# Honour the exclusions even when a path is named explicitly on the command
# line — the pre-commit hook passes staged filenames, and a staged file under
# .opencode/ or references/ must still be left alone.
force-exclude = true

[tool.ruff.lint]
# The blocking set (fabric PLAN Step 49). `E,F,I,UP` are pycodestyle/pyflakes/
# import-sort/pyupgrade; `B,SIM,RUF,S` add flake8-bugbear, flake8-simplify,
# Ruff-specific and bandit checks. `make lint` runs exactly this set — it is no
# longer advisory.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

# Every entry is a deliberate, codebase-wide exemption with its reason. A
# narrower suppression belongs in `per-file-ignores` below, or an inline
# `# noqa: CODE` carrying a reason — not here.
ignore = [
    # S310: urlopen on peer URLs built from the overlay/ports contract, never
    # from caller-supplied input. There is no untrusted scheme in play.
    "S310",
    # S603/S607: the services drive system tools (git, systemctl, wg, ip) with a
    # fixed argv list and rely on PATH lookup — that is the design, not a defect.
    "S603",
    "S607",
]

# A test file is allowed the things a shipped file is not: it binds all
# interfaces, writes to /tmp, plants fixture "secrets" and asserts freely.
# Keeping these scoped to tests means the same pattern in a service still fails.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S103", "S104", "S105", "S106", "S107", "S108", "S110", "S112"]
"peer-node/tests/**" = ["S101", "S103", "S104", "S105", "S106", "S107", "S108", "S110", "S112"]
"master-node/tests/**" = ["S101", "S103", "S104", "S105", "S106", "S107", "S108", "S110", "S112"]
