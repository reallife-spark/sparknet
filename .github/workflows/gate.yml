# The fabric's GitHub gate — a MIRROR of the local pre-merge gate, not a
# second source of truth.
#
# The local gate (scripts/pre-merge-gate.sh, wrapped by `make ci`) is what a
# merge must pass, and it runs on the machines the fabric actually deploys to:
# those are offline-first and have no forge, which is why the gate is a script
# and not a workflow. This file exists so the same script also runs on a PR —
# for a status check and a second opinion. If the two disagree, the LOCAL gate
# wins: fix this workflow, never the script (decision A5, PLAN Step 48).
#
# Actions are pinned to a full commit SHA, never a moving tag, matching the dsx
# practice recorded in references/nvidia-dsx-standard-practice.md (Step 48).
name: gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: pre-merge gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The repo's own bootstrap, not a bare `pip install`: it creates the
      # repo-local .venv the Makefile resolves VENV_PY to. Installing into the
      # runner's system pip instead (what this step did on the first real run,
      # 39056932940) left every test that spawns a subprocess failing on
      # `.venv/bin/python: No such file or directory`.
      - name: Install the gate's tooling
        run: make devtools

      # One step, one command: the workflow does not re-list the checks. The
      # gate script owns the vocabulary (keys-check, shims-check, lint,
      # format-check, shellcheck, validate, contract-test, render-check,
      # sbom-check, test-all) and this step runs it. PRs take the fast pass;
      # a push to the default branch runs the full suite, which is what
      # `make ci` does locally.
      - name: Run the local pre-merge gate
        env:
          CI_QUICK: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: make ci
