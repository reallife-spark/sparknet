# Secret scan on every push and pull request, patterned on the dsx repos'
# `trufflehog-scan`, using gitleaks instead so the scan is a single pinned
# binary rather than a shared org action
# (references/nvidia-dsx-standard-practice.md, Step 48).
#
# The LOCAL equivalent is `make keys-check` (and `pre-commit`, activated by
# `make hooks`): it refuses tracked key-shaped names, tracked PEM private-key
# blocks, and loose `.state/keys/` or `.state/secrets/` modes. This workflow
# adds the content-level pass that pattern-matching names cannot do — a token
# pasted into a page or a script.
#
# Note for the maintainer: gitleaks-action v2 is free for user-owned repos and
# needs a GITLEAKS_LICENSE secret for organisation-owned ones. The repo is
# private and single-operator, so it should run unlicensed; if GitHub starts
# refusing, the fix is the licence secret, not a different action.
name: secret-scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks reads history, not just the working tree.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
