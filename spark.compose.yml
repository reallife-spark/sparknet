# spark.compose.yml — the DGX Spark node as one image, many services.
#
# Every service below is the SAME image (spark.docker), started with a different
# dispatcher subcommand (spark-entrypoint.sh). Open WebUI is the only foreign
# image. That is deliberate: the node is one artifact, and a service is a process
# in it, so "change the vLLM base" is one rebuild that moves every service
# together.
#
# Bring it up (the setup script does this, this is the manual path):
#
#   make -C peer-node dist
#   cp dist/sparknet-peer.tar.gz peer-node/container/context/sparknet-peer.tar.gz
#   docker compose -f spark.compose.yml --env-file .state/spark.env build
#   docker compose -f spark.compose.yml --env-file .state/spark.env up -d
#
# Profiles keep the default node text-only and cheap; the multimodal halves are
# opt-in, so a first bring-up never downloads four models before it can answer:
#
#   default         nats vllm compute agent memory gpu (text LLM, memory + telemetry)
#   --profile kv    + kvrouter                        (KV-residency index)
#   --profile control + control                       (this node holds the Master key)
#   --profile webui + webui                           (Open WebUI on :3000)
#   --profile embed + vllm-embed                      (embeddings, for the RAG corpus)
#   --profile rerank + vllm-rerank                    (cross-encoder reranker)
#   --profile audio + vllm-audio                      (speech/audio model)
#   --profile ingest + ingest                         (one-shot: refresh the RAG index)
#   --profile vector + qdrant                         (node-local Qdrant on :6333)
#   --profile backup + backup                         (signed vault snapshots, on a timer)
#   --profile opencode + opencode                     (the node's opencode server on :4200)
#
# To run more than one multimodal profile at once, add them all:
#   docker compose -f spark.compose.yml --profile embed --profile audio up -d
#
# No GPU at hand? Layer spark.compose.cpu.yml: it drops the NVIDIA device
# reservations (the `vllm` and `gpu` services otherwise fail to start without a
# driver) and runs the CPU-only OpenAI-compatible stub engine with a synthetic
# telemetry fixture, so the *whole graph* can be smoked before a Spark arrives.
# `sparknet-node-setup.sh --engine stub` sets this up for you:
#
#   docker compose -f spark.compose.yml -f spark.compose.cpu.yml up -d
#
# Everything here is variable-interpolated from the environment (docker compose
# reads .env in this directory, or --env-file .state/spark.env). Nothing is
# hard-coded: the same file brings up spark-01 text-only or a full multimodal
# node by changing variables only.

name: sparknet-spark

# --- shared fragments --------------------------------------------------------

x-spark-node: &spark-node
  image: sparknet-spark-node:${SPARKNET_IMAGE_TAG:-dev}
  build:
    context: .
    dockerfile: spark.docker
    additional_contexts:
      # The host's `make -C gospark build build-gpu` output. A named context,
      # not a COPY, so the goSpark source never enters this build context.
      gospark: ${GOSPARK_DIR:-./gospark}
    args:
      VLLM_BASE: ${VLLM_BASE:-nvcr.io/nvidia/vllm:26.04-py3}
      OPENCODE_VERSION: ${OPENCODE_VERSION:-2.2.5}
      NATS_VERSION: ${NATS_VERSION:-2.14.2}
      INSTALL_DCGM: ${INSTALL_DCGM:-0}
  restart: unless-stopped

# Environment every node service shares. The shared secret is the SAME string in
# every container because the setup script generates it once into --env-file and
# into the host state dir; the dispatcher then just persists/reads it.
x-spark-env: &spark-env
  SPARKNET_NODE_ID: ${SPARKNET_NODE_ID:-spark-01}
  SPARKNET_ROLE: ${SPARKNET_ROLE:-peer}
  SPARKNET_OVERLAY_IPV4: ${SPARKNET_OVERLAY_IPV4:-10.100.0.2}
  SPARKNET_STATE_DIR: /srv/sparknet/peer-node/.state
  SPARKNET_BUS_URL: nats://nats:4222
  SPARKNET_SHARED_SECRET: ${SPARKNET_SHARED_SECRET:-}
  # Fabric join: the elected Master's pinned operational key and the Master-signed
  # registry the agent adopts. Both empty on a standalone node (open, self-signed);
  # both written by `sparknet-node-setup.sh --master-pub/--registry`. The registry
  # path is the IN-CONTAINER path — the state dir is the host bind mount below.
  SPARKNET_MASTER_PUB: ${SPARKNET_MASTER_PUB:-}
  GOSPARK_REGISTRY_FILE: ${GOSPARK_REGISTRY_FILE:-}
  VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-32B-Instruct}
  TZ: ${TZ:-UTC}

# .state is a HOST bind mount, never a named volume: keys and the signed ledger
# survive recreation and never enter an image layer. Same path and contract as
# the base node container.
x-state-volume: &state-volume
  type: bind
  source: ${SPARKNET_STATE_HOST:-./peer-node/.state}
  target: /srv/sparknet/peer-node/.state

# GPU reservation. Harmless on a host without a driver (the service simply
# fails to start); required on DGX Spark.
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

# vLLM wants a large shared-memory segment and host IPC for its workers.
x-vllm-runtime: &vllm-runtime
  ipc: host
  shm_size: ${VLLM_SHM_SIZE:-16gb}
  ulimits:
    memlock: -1
    stack: 67108864

# --- services ----------------------------------------------------------------

services:
  # The goSpark bus. Run as the upstream NATS image so a first bring-up does not
  # need the (large) node image just to have a bus; the node image also bakes a
  # pinned nats-server for `spark-entrypoint nats` and for tests. The default
  # below tracks the image's NATS_VERSION pin (spark.docker) so the upstream
  # service and the baked binary are the same release. JetStream
  # persists under the host state dir so a restart does not lose the stream (the
  # ledger lives in .state; losing the stream would orphan it).
  nats:
    image: nats:${NATS_IMAGE_TAG:-2.14.2-alpine}
    container_name: sparknet-nats
    command: ["-js", "-a", "0.0.0.0", "-p", "4222", "-m", "8222", "-sd", "/data"]
    volumes:
      - type: bind
        source: ${SPARKNET_STATE_HOST:-./peer-node/.state}/nats
        target: /data
    ports:
      - "${SPARKNET_BIND_LOCAL:-127.0.0.1}:4222:4222"
      - "${SPARKNET_BIND_LOCAL:-127.0.0.1}:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The text LLM. Serves the fabric MASTERSPIKE precontext through a wrapper
  # chat template built at start from the baked context; exposed on the LAN so
  # the node's API is reachable, not just in-network.
  #
  # VLLM_SERVICE_CMD selects the engine without a second service (and therefore
  # without a port/GPU conflict): default `vllm` (real engine, needs a GPU), or
  # `vllm-stub` (CPU-only OpenAI-compatible stub, no model, no driver) so the
  # whole node graph can be brought up and smoked on a machine with no NVIDIA
  # hardware. Same service name and port either way, so agent/compute wiring is
  # unchanged.
  vllm:
    <<: [*spark-node, *vllm-runtime, *gpu]
    container_name: sparknet-vllm
    command: ["${VLLM_SERVICE_CMD:-vllm}"]
    environment:
      <<: *spark-env
      VLLM_PORT: "8000"
      VLLM_GPU_MEM_UTIL: ${VLLM_GPU_MEM_UTIL:-0.85}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-65536}
      VLLM_EXTRA_ARGS: ${VLLM_EXTRA_ARGS:-}
      SPARKNET_MULTIMODAL: ${SPARKNET_MULTIMODAL:-}
      SPARKNET_MM_LIMIT: ${SPARKNET_MM_LIMIT:-}
      # The fabric precontext is baked into the chat template; on a small
      # context window the raw system prompt can exceed it, so the byte cap
      # is configurable per node: 0 = no cap.
      SPARKNET_PRECONTEXT: ${SPARKNET_PRECONTEXT:-1}
      SPARKNET_PRECONTEXT_MAX_BYTES: ${SPARKNET_PRECONTEXT_MAX_BYTES:-}
    volumes:
      - *state-volume
      - type: bind
        source: ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}
        target: /root/.cache/huggingface
    ports:
      - "${SPARKNET_BIND_API:-0.0.0.0}:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s

  # The Python compute plane beside the GPU: /v1/execute (infer/embed) with
  # X-Sparknet-Auth, forwarding to vLLM.
  compute:
    <<: [*spark-node]
    container_name: sparknet-compute
    command: ["compute"]
    depends_on:
      vllm:
        condition: service_started
    environment:
      <<: *spark-env
      COMPUTE_LISTEN_HOST: 0.0.0.0
      COMPUTE_LISTEN_PORT: "9090"
      VLLM_ENDPOINT: http://vllm:8000/v1/chat/completions
      SPARKNET_REQUIRE_VLLM: ${SPARKNET_REQUIRE_VLLM:-1}
      # Set by the embed profile; empty => the worker's local hashed embedder.
      SPARKNET_EMBED_ENDPOINT: ${SPARKNET_EMBED_ENDPOINT:-}
      SPARKNET_EMBED_MODEL: ${SPARKNET_EMBED_MODEL:-sparknet-embed-hash}
    volumes:
      - *state-volume
    ports:
      - "${SPARKNET_BIND_LOCAL:-127.0.0.1}:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The KV-residency index (RadixAttention prefixes). In the node, always
  # reachable to the agent; opt-in only so a minimal node skips it.
  kvrouter:
    <<: [*spark-node]
    profiles: ["kv"]
    container_name: sparknet-kvrouter
    command: ["kvrouter"]
    depends_on:
      vllm:
        condition: service_started
    environment:
      <<: *spark-env
      KV_LISTEN_HOST: 0.0.0.0
      KV_LISTEN_PORT: "9100"
    volumes:
      - *state-volume

  # The goSpark node: verifies Master-signed tasks, executes, attests. Its
  # gateway fronts vLLM; the compute endpoint is the worker above.
  agent:
    <<: [*spark-node]
    container_name: sparknet-agent
    command: ["agent"]
    depends_on:
      nats:
        condition: service_healthy
      compute:
        condition: service_started
    environment:
      <<: *spark-env
      GOSPARK_GATEWAY_LISTEN: 0.0.0.0:8080
      GOSPARK_GATEWAY_UPSTREAM: http://vllm:8000
      GOSPARK_COMPUTE_ENDPOINT: http://compute:9090
      GOSPARK_KV_ENDPOINT: http://kvrouter:9100
    volumes:
      - *state-volume
    ports:
      - "${SPARKNET_BIND_API:-0.0.0.0}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The node's typed memory service. Loopback only: the Python gateway is the
  # single authority front door, and the Go service trusts only that gateway's
  # token. It holds no key, signs nothing and writes no vault page.
  memory:
    <<: [*spark-node]
    container_name: sparknet-memory
    command: ["memory"]
    environment:
      <<: *spark-env
      GOSPARK_MEMORY_LISTEN: 127.0.0.1:4110
      GOSPARK_MEMORY_STATE: /srv/sparknet/peer-node/.state/memory
      GOSPARK_MEMORY_NODE_ID: ${SPARKNET_NODE_ID:-spark-01}
      GOSPARK_MEMORY_GATEWAY_TOKEN: ${GOSPARK_MEMORY_GATEWAY_TOKEN:-}
      GOSPARK_MEMORY_VAULT_ROOTS: ${GOSPARK_MEMORY_VAULT_ROOTS:-/srv/sparknet/peer-node,/srv/sparknet/knowledge}
      GOSPARK_MEMORY_OPENCODE_CMD: ${GOSPARK_MEMORY_OPENCODE_CMD:-}
      GOSPARK_MEMORY_QDRANT_URL: ${GOSPARK_MEMORY_QDRANT_URL:-http://127.0.0.1:6333}
      GOSPARK_MEMORY_QDRANT_API_KEY: ${SPARKNET_QDRANT_API_KEY:-}
      GOSPARK_MEMORY_QDRANT_COLLECTION: ${GOSPARK_MEMORY_QDRANT_COLLECTION:-sparknet-memory}
      GOSPARK_MEMORY_EMBED_ENDPOINT: ${GOSPARK_MEMORY_EMBED_ENDPOINT:-}
      GOSPARK_MEMORY_EMBED_MODEL: ${GOSPARK_MEMORY_EMBED_MODEL:-}
    volumes:
      - *state-volume
      - type: bind
        source: ${SPARKNET_KNOWLEDGE_HOST:-/srv/sparknet/knowledge}
        target: /srv/sparknet/knowledge
        read_only: true
    ports:
      - "${SPARKNET_BIND_LOCAL:-127.0.0.1}:4110:4110"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4110/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The authority front door for the memory service. It is a host-network
  # process so it can reach Open WebUI on loopback and the Go store on 4110;
  # it never touches a vault or a key.
  memory-gateway:
    <<: [*spark-node]
    container_name: sparknet-memory-gateway
    command: ["memory-gateway"]
    network_mode: host
    depends_on:
      memory:
        condition: service_started
    environment:
      <<: *spark-env
      SPARKNET_MEMORY_GATEWAY_BIND: 127.0.0.1:4093
      SPARKNET_MEMORY_URL: http://127.0.0.1:4110
      SPARKNET_USER_VAULT_ROOT: /srv/sparknet/knowledge
      SPARKNET_WEBUI_URL: ${SPARKNET_WEBUI_URL:-http://127.0.0.1:8180}
      GOSPARK_MEMORY_GATEWAY_TOKEN: ${GOSPARK_MEMORY_GATEWAY_TOKEN:-}
    volumes:
      - *state-volume
      - type: bind
        source: ${SPARKNET_KNOWLEDGE_HOST:-/srv/sparknet/knowledge}
        target: /srv/sparknet/knowledge
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4093/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The control plane. Only on the node that holds the Master signing key, so
  # it is a profile, never default.
  control:
    <<: [*spark-node]
    profiles: ["control"]
    container_name: sparknet-control
    command: ["control"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      <<: *spark-env
      SPARKNET_ROLE: master
      # The admin surface grants full registry control and goSpark refuses a
      # non-loopback bind outright, so it stays on 127.0.0.1 — the host
      # mapping below is loopback-only too. Reach it with an SSH tunnel.
      GOSPARK_ADMIN_LISTEN: 127.0.0.1:8899
      GOSPARK_METRICS_LISTEN: 0.0.0.0:9180
      GOSPARK_GATEWAY_LISTEN: 0.0.0.0:8081
    volumes:
      - *state-volume
    ports:
      - "${SPARKNET_BIND_LOCAL:-127.0.0.1}:8899:8899"
      - "${SPARKNET_BIND_API:-0.0.0.0}:8081:8081"

  # The GPU-telemetry sidecar. Degrades to available=false with a reason when
  # there is no driver/DCGM — never a hard failure, by contract.
  gpu:
    <<: [*spark-node, *gpu]
    container_name: sparknet-gpu
    command: ["gpu"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      <<: *spark-env
      SPARKNET_GPU_INTERVAL: ${SPARKNET_GPU_INTERVAL:-30s}
    volumes:
      - *state-volume

  # Open WebUI, the only foreign image, pointing at the node's own gateway.
  webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_TAG:-v0.13.0}
    profiles: ["webui"]
    container_name: sparknet-webui
    depends_on:
      agent:
        condition: service_started
    environment:
      OPENAI_API_BASE_URL: ${WEBUI_API_BASE:-http://agent:8080/v1}
      OPENAI_API_KEY: ${SPARKNET_SHARED_SECRET:-sparknet-local}
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      ENABLE_OLLAMA_API: "false"
    volumes:
      - type: bind
        source: ${SPARKNET_STATE_HOST:-./peer-node/.state}/webui
        target: /app/backend/data
    ports:
      - "${SPARKNET_BIND_API:-0.0.0.0}:3000:8080"
    restart: unless-stopped

  # Qdrant, the node's vector store. Loopback only: the fabric-facing surface
  # is the Master's signed 4223 listener, never a raw Qdrant port. The optional
  # peer AI stack (peer-node/configs/ai-stack/docker-compose.qdrant.yml) is the
  # live node surface; this profile makes the node image self-contained.
  qdrant:
    image: qdrant/qdrant:${QDRANT_TAG:-v1.20.0}
    profiles: ["vector"]
    container_name: sparknet-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${SPARKNET_QDRANT_API_KEY:?set at deploy time; do not commit}
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - type: bind
        source: ${SPARKNET_STATE_HOST:-./peer-node/.state}/qdrant
        target: /qdrant/storage
    ports:
      - "${SPARKNET_BIND_LOCAL:-127.0.0.1}:6333:6333"
      - "${SPARKNET_BIND_LOCAL:-127.0.0.1}:6334:6334"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # --- knowledge profiles (opt-in) -------------------------------------------
  #
  # The goSpark knowledge binaries as node services. They link no model and no
  # CUDA: ingest feeds the local RAG index through the compute plane; backup
  # signs content-addressed snapshots of the vault with the node key.

  # One-shot: crawl the node vault, chunk it, embed through the compute plane,
  # write the RAG index into the state dir. Enabling this profile refreshes the
  # index once at `up`; re-run on demand with
  #   docker compose -f spark.compose.yml --profile ingest run --rm ingest
  ingest:
    <<: [*spark-node]
    profiles: ["ingest"]
    container_name: sparknet-ingest
    command: ["ingest"]
    depends_on:
      compute:
        condition: service_started
    environment:
      <<: *spark-env
      GOSPARK_KNOWLEDGE_DIR: /srv/sparknet/peer-node
      GOSPARK_INGEST_OUT: /srv/sparknet/peer-node/.state/rag/index.json
      # Set by the embed profile to aim ingest at the dedicated embeddings
      # server; empty => the compute plane's local hashed embedder (chunks, no
      # vectors).
      GOSPARK_EMBED_ENDPOINT: ${SPARKNET_EMBED_ENDPOINT:-}
      GOSPARK_EMBED_MODEL: ${SPARKNET_EMBED_MODEL:-sparknet-embed-hash}
    volumes:
      - *state-volume
    restart: "no"

  # Signed snapshot daemon: hash the vault, copy it under the backup target and
  # write a node-signed manifest, every interval. The target is a HOST bind
  # mount and is deliberately OUTSIDE the source — a target inside the source
  # would be walked and included in its own snapshot. `.state` is skipped: the
  # signing key must never be inside the tree it signs.
  backup:
    <<: [*spark-node]
    profiles: ["backup"]
    container_name: sparknet-backup
    command: ["backup"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      <<: *spark-env
      GOSPARK_BACKUP_SOURCE: ${GOSPARK_BACKUP_SOURCE:-/srv/sparknet/peer-node}
      GOSPARK_BACKUP_TARGET: ${GOSPARK_BACKUP_TARGET:-/srv/sparknet/backups}
      GOSPARK_BACKUP_INTERVAL: ${GOSPARK_BACKUP_INTERVAL:-6h}
      GOSPARK_BACKUP_SKIP_DIRS: ${GOSPARK_BACKUP_SKIP_DIRS:-.state,.git,__pycache__}
    volumes:
      - *state-volume
      - type: bind
        source: ${SPARKNET_STATE_HOST:-./peer-node/.state}/backups
        target: /srv/sparknet/backups
    restart: unless-stopped

  # The node's opencode server over the vault. Local-only by design: it carries
  # the whole node's session authority, so it binds loopback and is never a
  # fabric edge. The vault is the image's WORKDIR, so opencode resolves the
  # node's project without a flag; its sessions and caches are pointed into the
  # mounted state so they survive a container recreation.
  #
  # The Open WebUI engine adapter is a separate host systemd service
  # (`sparknet-opencode-engine@peer`) on loopback 4204; it is deliberately not
  # a compose service because it supervises one sandbox container per user and
  # needs the Docker socket.
  opencode:
    <<: [*spark-node]
    profiles: ["opencode"]
    container_name: sparknet-opencode
    command: ["opencode"]
    depends_on:
      nats:
        condition: service_healthy
    environment:
      <<: *spark-env
      OPENCODE_HOST: ${OPENCODE_HOST:-127.0.0.1}
      OPENCODE_PORT: ${OPENCODE_PORT:-4200}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      XDG_DATA_HOME: /srv/sparknet/peer-node/.state/opencode/data
      XDG_CACHE_HOME: /srv/sparknet/peer-node/.state/opencode/cache
    volumes:
      - *state-volume
    ports:
      - "${SPARKNET_BIND_LOCAL:-127.0.0.1}:4200:4200"
    restart: unless-stopped

  # --- multimodal profile services (opt-in) ----------------------------------

  # Embeddings. A dedicated vLLM pooling server; point the compute worker at it
  # with SPARKNET_EMBED_ENDPOINT=http://vllm-embed:8001/v1/embeddings.
  vllm-embed:
    <<: [*spark-node, *vllm-runtime, *gpu]
    profiles: ["embed"]
    container_name: sparknet-vllm-embed
    command: ["vllm"]
    environment:
      <<: *spark-env
      VLLM_MODEL: ${VLLM_EMBED_MODEL:-BAAI/bge-m3}
      VLLM_PORT: "8001"
      SPARKNET_PRECONTEXT: "0"
      SPARKNET_PREFIX_CACHING: "0"
      VLLM_EXTRA_ARGS: "--task embed --gpu-memory-utilization ${VLLM_EMBED_GPU_MEM_UTIL:-0.15} ${VLLM_EMBED_EXTRA_ARGS:-}"
    volumes:
      - *state-volume
      - type: bind
        source: ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}
        target: /root/.cache/huggingface

  # Cross-encoder reranker.
  vllm-rerank:
    <<: [*spark-node, *vllm-runtime, *gpu]
    profiles: ["rerank"]
    container_name: sparknet-vllm-rerank
    command: ["vllm"]
    environment:
      <<: *spark-env
      VLLM_MODEL: ${VLLM_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      VLLM_PORT: "8002"
      SPARKNET_PRECONTEXT: "0"
      SPARKNET_PREFIX_CACHING: "0"
      VLLM_EXTRA_ARGS: "--task score --gpu-memory-utilization ${VLLM_RERANK_GPU_MEM_UTIL:-0.10} ${VLLM_RERANK_EXTRA_ARGS:-}"
    volumes:
      - *state-volume
      - type: bind
        source: ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}
        target: /root/.cache/huggingface

  # Speech / audio (ASR + audio understanding). A separate server so the text
  # model stays resident and cheap.
  vllm-audio:
    <<: [*spark-node, *vllm-runtime, *gpu]
    profiles: ["audio"]
    container_name: sparknet-vllm-audio
    command: ["vllm"]
    environment:
      <<: *spark-env
      VLLM_MODEL: ${VLLM_AUDIO_MODEL:-openai/whisper-large-v3}
      VLLM_PORT: "8003"
      SPARKNET_PRECONTEXT: "0"
      VLLM_EXTRA_ARGS: "--gpu-memory-utilization ${VLLM_AUDIO_GPU_MEM_UTIL:-0.15} ${VLLM_AUDIO_EXTRA_ARGS:-}"
    volumes:
      - *state-volume
      - type: bind
        source: ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}
        target: /root/.cache/huggingface
